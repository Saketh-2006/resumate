name: resumate_ai
description: "A thoughtful workspace for building your next resume."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  file_picker: ^13.1.0
  shared_preferences: ^2.5.3
  syncfusion_flutter_pdf: ^33.2.13+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-400.ttf
        - asset: assets/fonts/Lora-600.ttf
          weight: 600
        - asset: assets/fonts/Lora-700.ttf
          weight: 700
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-500.ttf
        - asset: assets/fonts/Caveat-700.ttf
          weight: 700
